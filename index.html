<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>CRISPR Interactive 3D</title>
  <style>
    * { box-sizing: border-box; }
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #030712; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #canvas-container { width: 100vw; height: 100vh; position: absolute; top:0; left:0; }
    
    #ui {
      position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%);
      z-index: 10; text-align: center; width: 92%; max-width: 450px; pointer-events: none;
    }
    .card {
      background: rgba(10, 16, 31, 0.88); backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 229, 255, 0.3); border-radius: 20px;
      padding: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); pointer-events: auto;
    }
    #step-badge {
      display: inline-block; background: #00e5ff; color: #030712; font-weight: 800;
      font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px;
      padding: 4px 12px; border-radius: 12px; margin-bottom: 8px;
    }
    #title { color: #fff; font-size: 18px; font-weight: 700; margin: 0 0 6px 0; }
    #desc { color: #94a3b8; font-size: 13px; margin: 0 0 14px 0; line-height: 1.4; }
    #seq-info { color: #00e5ff; font-family: monospace; font-size: 12px; font-weight: bold; margin-bottom: 10px; }
    
    button {
      background: linear-gradient(135deg, #00e5ff, #0088ff); border: none; color: #fff;
      padding: 14px 28px; font-size: 15px; font-weight: 700; border-radius: 30px;
      cursor: pointer; box-shadow: 0 4px 15px rgba(0, 229, 255, 0.4); width: 100%; transition: 0.1s;
    }
    button:active { transform: scale(0.96); }

    /* Legend Overlay */
    #legend {
      position: absolute; top: 15px; left: 15px; z-index: 10;
      background: rgba(10, 16, 31, 0.7); backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 10px 14px;
      color: #fff; font-size: 11px; font-family: monospace;
    }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <div id="legend">
    <div><span class="dot" style="background:#ff0055"></span><b>A</b> (Adenine)</div>
    <div><span class="dot" style="background:#00e5ff"></span><b>T</b> (Thymine)</div>
    <div><span class="dot" style="background:#ffaa00"></span><b>G</b> (Guanine)</div>
    <div><span class="dot" style="background:#00ff66"></span><b>C</b> (Cytosine)</div>
  </div>

  <div id="ui">
    <div class="card">
      <div id="step-badge">Step 1 of 4</div>
      <div id="title">1. The Search Engine 🔍</div>
      <div id="seq-info">TARGET: 5'-ACCGT-3' | PAM: NGG</div>
      <div id="desc">Cas9 slides along DNA using a guide RNA to read letter sequences matching its target code.</div>
      <button id="action-btn" onclick="nextStep()">Found Target! Lock On ➔</button>
    </div>
  </div>

  <script>
    // 1. Setup Scene & Environment
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x030712, 0.02);

    const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 2, 28);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // Lights
    scene.add(new THREE.AmbientLight(0xffffff, 0.6));
    const pLight1 = new THREE.PointLight(0x00e5ff, 2, 80); pLight1.position.set(10, 10, 10); scene.add(pLight1);
    const pLight2 = new THREE.PointLight(0xff0055, 1.5, 80); pLight2.position.set(-10, -10, -10); scene.add(pLight2);

    // Floating Molecular Dust Particles
    const pGeo = new THREE.BufferGeometry();
    const pCount = 250, pPos = new Float32Array(pCount * 3);
    for(let i = 0; i < pCount * 3; i++) pPos[i] = (Math.random() - 0.5) * 60;
    pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
    const particles = new THREE.Points(pGeo, new THREE.PointsMaterial({ size: 0.15, color: 0x00e5ff, transparent: true, opacity: 0.5 }));
    scene.add(particles);

    // 2. Base Materials & Labels Setup
    const baseColors = [0xff0055, 0x00e5ff, 0xffaa00, 0x00ff66]; // A, T, G, C
    const baseLetters = ["A", "T", "G", "C"];
    const targetSeqIndices = [18, 19, 20, 21, 22]; // Specific 5-base target zone (ACCGT)
    const targetBases = [0, 3, 3, 2, 1]; // A, C, C, G, T

    function createTextSprite(text, colorHex) {
      const canvas = document.createElement('canvas');
      canvas.width = 64; canvas.height = 64;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = colorHex;
      ctx.font = 'Bold 40px Arial';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(text, 32, 32);
      const texture = new THREE.CanvasTexture(canvas);
      const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture }));
      sprite.scale.set(1.2, 1.2, 1);
      return sprite;
    }

    // 3. Build Helix Structure
    const numPairs = 40, helixRadius = 2.5, helixHeight = 36;
    const leftStrand = [], rightStrand = [], rungs = [];
    const dnaGroup = new THREE.Group();

    for (let i = 0; i < numPairs; i++) {
      const y = (i / numPairs) * helixHeight - helixHeight / 2;
      const angle = i * 0.45;
      
      const isTarget = targetSeqIndices.includes(i);
      const baseIdx = isTarget ? targetBases[targetSeqIndices.indexOf(i)] : (i % 4);
      const complementIdx = baseIdx === 0 ? 1 : baseIdx === 1 ? 0 : baseIdx === 2 ? 3 : 2; // A-T, G-C matching

      const mat1 = new THREE.MeshPhongMaterial({ color: baseColors[baseIdx] });
      const mat2 = new THREE.MeshPhongMaterial({ color: baseColors[complementIdx] });

      // Strand Spheres
      const p1 = new THREE.Mesh(new THREE.SphereGeometry(0.35, 16, 16), mat1);
      p1.position.set(Math.cos(angle) * helixRadius, y, Math.sin(angle) * helixRadius);
      dnaGroup.add(p1);
      leftStrand.push({ mesh: p1, origY: y, idx: i });

      const p2 = new THREE.Mesh(new THREE.SphereGeometry(0.35, 16, 16), mat2);
      p2.position.set(Math.cos(angle + Math.PI) * helixRadius, y, Math.sin(angle + Math.PI) * helixRadius);
      dnaGroup.add(p2);
      rightStrand.push({ mesh: p2, origY: y, idx: i });

      // Base Letter Overlay
      const label = createTextSprite(baseLetters[baseIdx], "#ffffff");
      p1.add(label);

      // Connecting Rungs
      const rungGeo = new THREE.CylinderGeometry(0.08, 0.08, helixRadius * 2, 8);
      const rung = new THREE.Mesh(rungGeo, new THREE.MeshPhongMaterial({ color: baseColors[baseIdx] }));
      rung.position.set(0, y, 0); rung.rotation.z = Math.PI / 2; rung.rotation.y = -angle;
      dnaGroup.add(rung);
      rungs.push({ mesh: rung, origY: y, idx: i });
    }
    scene.add(dnaGroup);

    // 4. Cas9 Complex & Laser Setup
    const cas9Group = new THREE.Group();
    const cas9Mat = new THREE.MeshPhongMaterial({ color: 0x8b5cf6, transparent: true, opacity: 0.6, shininess: 100 });
    const cas9Body = new THREE.Mesh(new THREE.SphereGeometry(5.2, 32, 32), cas9Mat);
    cas9Body.scale.set(1.4, 0.8, 1.1);
    cas9Group.add(cas9Body);

    // Laser Beam
    const laser = new THREE.Mesh(
      new THREE.CylinderGeometry(0.06, 0.06, 10, 16),
      new THREE.MeshBasicMaterial({ color: 0xff0055, transparent: true, opacity: 0.8 })
    );
    laser.rotation.z = Math.PI / 2;
    cas9Group.add(laser);
    scene.add(cas9Group);

    // Green Donor DNA Patch
    const donorGroup = new THREE.Group();
    const donorMat = new THREE.MeshPhongMaterial({ color: 0x10b981, emissive: 0x065f46 });
    const donorPatch = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.45, 4.5, 16), donorMat);
    donorGroup.add(donorPatch);
    donorGroup.scale.set(0,0,0);
    scene.add(donorGroup);

    // 5. State Machine & Steps Data
    let step = 0;
    const stepsData = [
      { badge: "Step 1 of 4", title: "1. The Search Engine 🔍", seq: "TARGET: 5'-ACCGT-3' | PAM: NGG", desc: "Cas9 slides along DNA using guide RNA to read letter codes.", btn: "Found Target! Lock On ➔" },
      { badge: "Step 2 of 4", title: "2. The Key Fits 🔑", seq: "MATCH CONFIRMED: 5'-ACCGT-3'", desc: "Guide RNA pairs with ACCGT sequence. Cas9 locks onto DNA.", btn: "Cut Bad Code ✂️" },
      { badge: "Step 3 of 4", title: "3. Molecular Scissors ✂️", seq: "DOUBLE-STRAND BREAK CLEAVAGE", desc: "Cas9 cuts through both strands at target site 5'-ACCGT-3'.", btn: "Insert Healthy Fix 🧬" },
      { badge: "Step 4 of 4", title: "4. Spell-Check Repair 🩹", seq: "GENE EDITED: REPLACEMENT COMPLETE", desc: "Green donor gene binds, permanently editing sequence code!", btn: "Restart Demo 🔄" }
    ];

    function nextStep() {
      step = (step + 1) % 4;
      const d = stepsData[step];
      document.getElementById('step-badge').innerText = d.badge;
      document.getElementById('title').innerText = d.title;
      document.getElementById('seq-info').innerText = d.seq;
      document.getElementById('desc').innerText = d.desc;
      document.getElementById('action-btn').innerText = d.btn;

      if (step === 0) {
        donorGroup.scale.set(0,0,0);
        cas9Mat.opacity = 0.6;
        rungs.forEach(r => r.mesh.scale.x = 1);
      }
    }

    // 6. Animation Engine
    let time = 0;
    function animate() {
      requestAnimationFrame(animate);
      time += 0.02;
      controls.update();
      particles.rotation.y += 0.0005;

      laser.visible = (step === 0 || step === 1);

      if (step === 0) {
        cas9Group.position.y = Math.sin(time) * 8;
        dnaGroup.rotation.y += 0.005;
      } else if (step === 1) {
        cas9Group.position.y += (0 - cas9Group.position.y) * 0.1;
        dnaGroup.rotation.y += 0.002;
      } else if (step === 2) {
        leftStrand.forEach(p => p.mesh.position.y += ((p.idx >= 20 ? p.origY + 2.5 : p.origY - 2.5) - p.mesh.position.y) * 0.08);
        rightStrand.forEach(p => p.mesh.position.y += ((p.idx >= 20 ? p.origY + 2.5 : p.origY - 2.5) - p.mesh.position.y) * 0.08);
        rungs.forEach(r => {
          if (targetSeqIndices.includes(r.idx)) r.mesh.scale.x = Math.max(0, r.mesh.scale.x - 0.05);
          else r.mesh.position.y += ((r.idx >= 20 ? r.origY + 2.5 : r.origY - 2.5) - r.mesh.position.y) * 0.08;
        });
      } else if (step === 3) {
        cas9Mat.opacity = 0.15;
        donorGroup.scale.lerp(new THREE.Vector3(1,1,1), 0.08);
        leftStrand.forEach(p => p.mesh.position.y += (p.origY - p.mesh.position.y) * 0.08);
        rightStrand.forEach(p => p.mesh.position.y += (p.origY - p.mesh.position.y) * 0.08);
        rungs.forEach(r => {
          r.mesh.position.y += (r.origY - r.mesh.position.y) * 0.08;
          if (targetSeqIndices.includes(r.idx)) {
            r.mesh.material = donorMat;
            r.mesh.scale.x += (1 - r.mesh.scale.x) * 0.08;
          }
        });
        dnaGroup.rotation.y += 0.008;
      }

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
